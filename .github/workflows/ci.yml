name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate reads the schema only — dummy URL is fine
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        # Audit PRODUCTION deps only (--omit=dev): the gate protects the deployed app's
        # runtime, and dev/build tooling (eslint, etc.) never ships — auditing it just
        # produces a constant stream of irrelevant transitive advisories. Then fail on any
        # remaining high/critical EXCEPT a documented allowlist (see scripts/check-audit.mjs),
        # which currently covers postcss (a build-time-only prod dep pulled by Next).
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/check-audit.mjs
